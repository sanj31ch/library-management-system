<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Analytics</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{url_for('static',filename='styles2.css')}}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="blur-bg"></div>

  <div class="sidebar">
    <div>
      <div class="sidebar-title"><i class="fas fa-book-open"></i> GP Library</div>
      <button class="sidebar-btn home-btn" onclick="window.location.href='/libhome'"><i class="fas fa-home"></i> Home</button>
      <button class="sidebar-btn view-profile-btn" onclick="window.location.href='/libprofile'"><i class="fas fa-id-card"></i> View Profile</button>
      <button class="sidebar-btn view-books-btn" onclick="window.location.href='/libbooks'"><i class="fas fa-book-reader"></i> View Books</button>
      <button class="sidebar-btn book-history-btn" onclick="window.location.href='/libhistory'"><i class="fas fa-history"></i> Book History</button>
      <button class="sidebar-btn students-btn" onclick="window.location.href='/libstudents'"><i class="fas fa-users"></i> Students</button>
      <button class="sidebar-btn notice-btn dropdown"><i class="fas fa-bell"></i> Notice</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/libsend_notice'"><i class="fas fa-paper-plane"></i> Send Notice</button>
        <button onclick="window.location.href='/libview_notice'"><i class="fas fa-eye"></i> View Notices</button>
      </div>
      <button class="sidebar-btn attendance-btn dropdown"><i class="fas fa-calendar-check"></i> Attendance</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/libmark_attendence'"><i class="fas fa-user-check"></i> Mark Attendance</button>
        <button onclick="window.location.href='/libview_attendance'"><i class="fas fa-eye"></i> View Attendance</button>
      </div>
    </div>
    <button class="logout-btn" onclick="window.location.href='/'"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <div class="dashboard">
    <div class="home-layout">
      <h1><i class="fas fa-chart-line"></i> Library Analytics</h1>

      <div class="stats-container">
        <div class="stat-card">
          <h3>Total Books</h3>
          <div class="value" id="totalBooks">0</div>
          <div class="change" id="bookTitles">0 titles</div>
        </div>
        <div class="stat-card">
          <h3>Available Books</h3>
          <div class="value" id="availableBooks">0</div>
          <div class="change" id="availablePercent">0% available</div>
        </div>
        <div class="stat-card">
          <h3>Issued Books</h3>
          <div class="value" id="issuedBooks">0</div>
          <div class="change" id="overdueBooks">0 overdue</div>
        </div>
        <div class="stat-card">
          <h3>Registered Students</h3>
          <div class="value" id="totalStudents">0</div>
          <div class="change" id="activeIssues">0 active issues</div>
        </div>
      </div>

      <div class="chart-container" style="height: 300px; width: 400px;">
        <h2>Book Availability</h2>
        <canvas id="availabilityChart"></canvas>
      </div>

      <div class="chart-container" style="height: 300px; width: 400px;">
        <h2>Monthly Issues</h2>
        <canvas id="monthlyIssuesChart"></canvas>
      </div>

      <div class="form-actions" style="margin-top: 20px;">
        <button class="back-btn" onclick="window.location.href='/libhome'">Back to Home</button>
      </div>
    </div>
  </div>

  <script>
    let books =  [];
    let students =  [];
    let issuedBooks =  [];
    fetch('/book')
    .then(response => response.json())
    .then(data => {
      books = data.book;
      console.log(books);
      return fetch('/regstudents');
    })
    .then(response => response.json())
    .then(data => {
      students = data;
      console.log(students);
      return fetch('/get_issued_booksFA');
    })
    .then(response => response.json())
    .then(data => {
      issuedBooks = data;
      console.log(issuedBooks);
      updateDashboard();
    })
    
    function updateDashboard(){
      console.log(books.OUT_OF);
    const totalBooks = books.reduce((sum, book) => sum + parseInt(book.OUT_OF), 0)||0;
    const availableBooks = books.reduce((sum, book) => sum + parseInt(book.AVAILABLE), 0)||0;
    const issuedBooksCount = totalBooks - availableBooks;
    const totalStudents = students.length;
    const today = new Date().toISOString().split('T')[0];
    const overdueBooks = issuedBooks.filter(issue => !issue.RETURN_DATE && issue.DUE_DATE < today).length;

    // Set stats
    document.getElementById("totalBooks").textContent = totalBooks;
    document.getElementById("bookTitles").textContent = books.length + " titles";
    document.getElementById("availableBooks").textContent = availableBooks;
    document.getElementById("availablePercent").textContent = Math.round((availableBooks / totalBooks) * 100) + "% available";
    document.getElementById("issuedBooks").textContent = issuedBooksCount||0;
    document.getElementById("overdueBooks").textContent = `${overdueBooks} overdue`;
    document.getElementById("totalStudents").textContent = totalStudents;
    document.getElementById("activeIssues").textContent = `${issuedBooksCount} active issues`;

    // Pie Chart - Book Availability
    new Chart(document.getElementById("availabilityChart").getContext("2d"), {
      type: "pie",
      data: {
        labels: ["Available", "Issued"],
        datasets: [{
          data: [availableBooks, issuedBooksCount],
          backgroundColor: ["#4CAF50", "#2196F3"]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom' }
        }
      }
    });

    // Bar Chart - Monthly Issues (Sample data)
    new Chart(document.getElementById("monthlyIssuesChart").getContext("2d"), {
      type: "bar",
      data: {
        labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
        datasets: [{
          label: "Books Issued",
          data: [12, 19, 15, 20, 18, 25],
          backgroundColor: "#4CAF50"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  }
    const dropdowns = document.querySelectorAll('.sidebar-btn.dropdown'); 
    dropdowns.forEach(btn => { 
      btn.addEventListener('click', (e) => {
        // Don't toggle if clicking on a dropdown button that's already active
        if (e.target.classList.contains('active')) {
          return;
        }
        
        dropdowns.forEach(b => { 
          if (b !== btn) b.classList.remove('active'); 
        }); 
        btn.classList.toggle('active'); 
      }); 
    }); 

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.sidebar-btn.dropdown')) {
        dropdowns.forEach(btn => {
          btn.classList.remove('active');
        });
      }
    });
  </script>
</body>
</html>
