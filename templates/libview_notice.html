<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Notices</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{url_for('static',filename='styles2.css')}}">
  <style>
    .sidebar-btn.home-btn ,
    .sidebar-btn.profile-btn,
    .sidebar-btn.books-btn,
    .sidebar-btn.history-btn,
    .sidebar-btn.students-btn ,
    .sidebar-btn.notice-btn,
    .sidebar-btn.attendance-btn,
    .logout-btn {  background-color: rgb(236, 68, 21); }
    </style>
</head>
<body>
  <div class="blur-bg"></div>

  <div class="sidebar">
    <div>
      <div class="sidebar-title"><i class="fas fa-book-open"></i> GP Library</div>
      <button class="sidebar-btn home-btn" onclick="window.location.href='/libhome'"><i class="fas fa-home"></i> Home</button>
      <button class="sidebar-btn view-profile-btn" onclick="window.location.href='/libprofile'"><i class="fas fa-id-card"></i> View Profile</button>
      <button class="sidebar-btn view-books-btn" onclick="window.location.href='/libbooks'"><i class="fas fa-book-reader"></i> View Books</button>
      <button class="sidebar-btn book-history-btn" onclick="window.location.href='/libhistory'"><i class="fas fa-history"></i> Book History</button>
      <button class="sidebar-btn students-btn" onclick="window.location.href='/libstudents'"><i class="fas fa-users"></i> Students</button>
      <button class="sidebar-btn notice-btn dropdown"><i class="fas fa-bell"></i> Notice</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/libsend_notice'"><i class="fas fa-paper-plane"></i> Send Notice</button>
        <button onclick="window.location.href='/libview_notice'"><i class="fas fa-eye"></i> View Notices</button>
      </div>
      <button class="sidebar-btn attendance-btn dropdown"><i class="fas fa-calendar-check"></i> Attendance</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/libmark_attendence'"><i class="fas fa-user-check"></i> Mark Attendance</button>
        <button onclick="window.location.href='/libview_attendance'"><i class="fas fa-eye"></i> View Attendance</button>
      </div>
      <button class="sidebar-btn settings-btn dropdown active"><i class="fas fa-cog"></i> Settings</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/fine_settings'"><i class="fas fa-rupee-sign"></i> Fine Settings</button>
        <button onclick="window.location.href='/subscription_settings'"><i class="fas fa-id-card"></i> Subscription Settings</button>
        <!--<button onclick="window.location.href='/holiday_settings'"><i class="fas fa-calendar-times"></i> Holiday Settings</button>
        <button onclick="window.location.href='/theme_settings'"><i class="fas fa-palette"></i> Theme Settings</button> -->
      </div>
    </div>
    <button class="logout-btn" onclick="window.location.href='/'"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>
  

  <div class="dashboard" id="dashboard-content">
    <div class="home-layout">
      <h1><i class="fas fa-eye"></i> View Notices</h1>

      <div class="filter-container">
        <div class="filter-group">
          <label>Filter by Sender:</label>
          <select id="noticeSenderFilter">
            <option value="all">All</option>
            <option value="Library Admin">Library Admin</option>
            <option value="Events Team">Events Team</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Filter by Date:</label>
          <input type="date" id="noticeDateFilter" />
        </div>
        <div class="filter-group">
          <label>Search:</label>
          <input type="text" id="noticeSearch" placeholder="Search notices..." />
        </div>
      </div>

      <h2 style="margin-top: 20px;">Sent Notices</h2>
      <br>
      <div class="notices-container" id="noticeList"></div>
      <h2 style="margin-top: 20px;">Received Notices</h2>
      <br>
      <div class="notices-container" id="noticeList2"></div>
    </div>
  </div>

  <script>
    
  let allNotices = [];

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  async function fetchNotices() {
    const response = await fetch('/api/notices/new?username=Library Admin'); // Replace with dynamic user if needed
    const data = await response.json();
    allNotices = data.notices || [];
    console.log(allNotices);
    renderNotices();
  }

  async function fetchSnotices() {
  const res = await fetch('/libsentnotices');
  const data = await res.json();
  const container = document.getElementById("noticeList");
  container.innerHTML = "";

  data.forEach(notice => {
    const card = document.createElement("div");
    card.className = "notice-card";
    card.innerHTML = `
      <div class="notice-header">
        <h3>${notice.title}</h3>
        <span class="notice-date">${formatDate(notice.date)} ${notice.time ? 'at ' + notice.time : ''}</span>
      </div>
      <div class="notice-content">
        <p>${notice.content}</p>
      </div>
      <div class="notice-footer">
        <span class="notice-sender">From: ${notice.sender} | To: ${notice.recipient} (${notice.type})</span>
        <button class="delete-btn" onclick="deleteNotice(${notice.id})">
          <i class="fas fa-trash"></i> Delete
        </button>
      </div>
    `;
    container.appendChild(card);
  });

  filterNotices();
}

  
  function renderNotices() {
    const container = document.getElementById("noticeList2");
    container.innerHTML = "";

    allNotices.forEach(notice => {
      const card = document.createElement("div");
      card.className = "notice-card";
      card.innerHTML = `
        <div class="notice-header">
          <h3>${notice.SUBJECT}</h3>
          <span class="notice-date">${formatDate(notice.NDATE)}</span>
        </div>
        <div class="notice-content">
          <p>${notice.CONTENT}</p>
        </div>
        <div class="notice-footer">
          <span class="notice-sender">From: ${notice.NFROM} | To: ${notice.NTO}</span>
          <button class="delete-btn" onclick="deleteNotice(${notice.NOTICE_ID})">
            <i class="fas fa-trash"></i> Delete
          </button>
        </div>
      `;
      container.appendChild(card);
    });

    filterNotices();
  }

  async function deleteNotice(id) {
    if (confirm("Are you sure you want to delete this notice?")) {
      const response = await fetch('/api/notices/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      const result = await response.json();
      if (result.status === 'success') {
        fetchNotices();
      }
    }
  }

  function filterNotices() {
    const sender = document.getElementById("noticeSenderFilter").value.toLowerCase();
    const date = document.getElementById("noticeDateFilter").value;
    const search = document.getElementById("noticeSearch").value.toLowerCase();

    const all = document.querySelectorAll(".notice-card");
    all.forEach(card => {
      const text = card.textContent.toLowerCase();
      const dateText = card.querySelector(".notice-date").textContent;
      const senderMatch = sender === "all" || text.includes(sender);
      const dateMatch = !date || dateText.includes(new Date(date).toLocaleDateString('en-US'));
      const searchMatch = !search || text.includes(search);
      card.style.display = senderMatch && dateMatch && searchMatch ? "" : "none";
    });
  }

  document.getElementById("noticeSenderFilter").addEventListener("change", filterNotices);
  document.getElementById("noticeDateFilter").addEventListener("change", filterNotices);
  document.getElementById("noticeSearch").addEventListener("input", filterNotices);

  fetchNotices();
  //fetchSnotices();

  </script>
</body>
</html>
