<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Books | GP Library</title>
  <link rel="stylesheet" href="{{url_for('static',filename='styles2.css')}}" />
  
</head>
<body>
  <div class="blur-bg"></div>

  <div class="sidebar">
    <div>
      <div class="sidebar-title"><i class="fas fa-book-open"></i> GP Library</div>
      <button class="sidebar-btn home-btn" onclick="window.location.href='/libhome'"><i class="fas fa-home"></i> Home</button>
      <button class="sidebar-btn view-profile-btn" onclick="window.location.href='/libprofile'"><i class="fas fa-id-card"></i> View Profile</button>
      <button class="sidebar-btn view-books-btn" onclick="window.location.href='/libbooks'"><i class="fas fa-book-reader"></i> View Books</button>
      <button class="sidebar-btn book-history-btn" onclick="window.location.href='/libhistory'"><i class="fas fa-history"></i> Book History</button>
      <button class="sidebar-btn students-btn" onclick="window.location.href='/libstudents'"><i class="fas fa-users"></i> Students</button>
      <button class="sidebar-btn notice-btn dropdown"><i class="fas fa-bell"></i> Notice</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/libsend_notice'"><i class="fas fa-paper-plane"></i> Send Notice</button>
        <button onclick="window.location.href='/libview_notice'"><i class="fas fa-eye"></i> View Notices</button>
      </div>
      <button class="sidebar-btn attendance-btn dropdown"><i class="fas fa-calendar-check"></i> Attendance</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/libmark_attendence'"><i class="fas fa-user-check"></i> Mark Attendance</button>
        <button onclick="window.location.href='/libview_attendance'"><i class="fas fa-eye"></i> View Attendance</button>
      </div>
    </div>
    <button class="logout-btn" onclick="window.location.href='/'"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <div class="dashboard" id="dashboard-content">
    <div class="home-layout">
      <h1><i class="fas fa-book-reader"></i> View All Books</h1>

      <input type="text" class="search-input" id="bookSearch" placeholder="Search by book name, author or ID..." />

      <div class="data-table-container">
        <table class="data-table" id="bookTable">
          <thead>
            <tr>
              <th>Book ID</th>
              <th>Book Name</th>
              <th>Author</th>
              <th>ISBN</th>
              <th>Publisher</th>
              <th>Available</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookTableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toast-message">Action complete</span>
  </div>

  <script>
    
    
    let books={};
    function updateBookTable() {
      const tbody = document.getElementById("bookTableBody");
      tbody.innerHTML = "";

      books.forEach((book,index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${book.BOOK_ID}</td>
          <td>${book.TITLE}</td>
          <td>${book.AUTHOR}</td>
          <td>${book.ISBN}</td>
          <td>${book.PUBLISHER}</td>
          <td>${book.AVAILABLE}/${book.OUT_OF}</td>
          <td>${book.STATUS}</td>
          <td>
            <button class="delete-btn" onclick="deleteBook('${book.BOOK_ID}')"><i class="fas fa-trash"></i> Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      toast.querySelector("#toast-message").textContent = message;
      toast.classList.toggle("error", isError);
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

   

    function deleteBook(id) {
      if (!confirm("Are you sure you want to delete this book?")) return;
      fetch(`/deletebook/${id}`, {
        method: 'DELETE'
      })
      .then(response=>response.json())
      .then(data=>{
        alert(data);
        return fetch('/book')
          .then(response => response.json())
          .then(data => {
            books = data.book;
            updateBookTable();
            showToast('Book deleted successfully');
          })
          .catch(error => {
            console.error('Error fetching books:', error);
            showToast('Failed to load books', true);
          });
      })
    }

    document.getElementById("bookSearch").addEventListener("input", function () {
      const term = this.value.toLowerCase();
      Array.from(document.querySelectorAll("#bookTableBody tr")).forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(term) ? "" : "none";
      });
    });
   
      fetch('/book')
      .then(response => response.json())
      .then(data => {
        books = data.book;
        updateBookTable();
      })
      .catch(error => {
        console.error('Error fetching books:', error);
        showToast('Failed to load books', true);
      });
    

    function removeb(rid){
      const bookTable = document.getElementById("bookTableBody");
      const row=bookTable.getElementsByTagName('tr')
      for(let i=1;i<row.length;i++){
        let cell=row[i].cells[0].textContent;
        if (cell==rid) {
          bookTable.removeChild(row[i]);
          showToast('Book deleted successfully');

          break;
        }
      }
    }

    const dropdowns = document.querySelectorAll('.sidebar-btn.dropdown'); 
    dropdowns.forEach(btn => { 
      btn.addEventListener('click', (e) => {
        // Don't toggle if clicking on a dropdown button that's already active
        if (e.target.classList.contains('active')) {
          return;
        }
        
        dropdowns.forEach(b => { 
          if (b !== btn) b.classList.remove('active'); 
        }); 
        btn.classList.toggle('active'); 
      }); 
    }); 

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.sidebar-btn.dropdown')) {
        dropdowns.forEach(btn => {
          btn.classList.remove('active');
        });
      }
    });
  </script>
</body>
</html>
