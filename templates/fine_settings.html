<body>
  <div class="blur-bg"></div>

  <div class="sidebar">
    <div>
      <div class="sidebar-title"><i class="fas fa-book-open"></i> GP Library</div>
      <button class="sidebar-btn home-btn" onclick="window.location.href='/libhome'"><i class="fas fa-home"></i> Home</button>
      <button class="sidebar-btn view-profile-btn" onclick="window.location.href='/libprofile'"><i class="fas fa-id-card"></i> View Profile</button>
      <button class="sidebar-btn view-books-btn" onclick="window.location.href='/libbooks'"><i class="fas fa-book-reader"></i> View Books</button>
      <button class="sidebar-btn book-history-btn" onclick="window.location.href='/libhistory'"><i class="fas fa-history"></i> Book History</button>
      <button class="sidebar-btn students-btn" onclick="window.location.href='/libstudents'"><i class="fas fa-users"></i> Students</button>
      <button class="sidebar-btn notice-btn dropdown"><i class="fas fa-bell"></i> Notice</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/libsend_notice'"><i class="fas fa-paper-plane"></i> Send Notice</button>
        <button onclick="window.location.href='/libview_notice'"><i class="fas fa-eye"></i> View Notices</button>
      </div>
      <button class="sidebar-btn attendance-btn dropdown"><i class="fas fa-calendar-check"></i> Attendance</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/libmark_attendence'"><i class="fas fa-user-check"></i> Mark Attendance</button>
        <button onclick="window.location.href='/libview_attendance'"><i class="fas fa-eye"></i> View Attendance</button>
      </div>
      <button class="sidebar-btn settings-btn dropdown active"><i class="fas fa-cog"></i> Settings</button>
      <div class="dropdown-content">
        <button onclick="window.location.href='/fine_settings'"><i class="fas fa-rupee-sign"></i> Fine Settings</button>
        <button onclick="window.location.href='/subscription_settings'"><i class="fas fa-id-card"></i> Subscription Settings</button>
        <!--<button onclick="window.location.href='/holiday_settings'"><i class="fas fa-calendar-times"></i> Holiday Settings</button>
        <button onclick="window.location.href='/theme_settings'"><i class="fas fa-palette"></i> Theme Settings</button> -->
      </div>
    </div>
    <button class="logout-btn" onclick="window.location.href='/'"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <div class="dashboard">
    <div class="welcome-card">
      <h1><i class="fas fa-rupee-sign"></i> Fine Settings</h1>
      <p>Configure fine calculation and notification settings</p>
    </div>
    
    <div class="stats-card">
      <div class="settings-group">
        <h3>Fine Calculation</h3>
        <div class="form-group">
          <label for="fine-rate">Daily Fine Rate (₹)</label>
          <input type="number" id="fine-rate" value="{{df}}" min="0" step="1">
        </div>
        <div class="form-group">
          <label for="grace-period">Grace Period (days)</label>
          <input type="number" id="grace-period" value="{{gp}}" min="0" step="1">
        </div>
        <div class="form-group">
          <label for="dnot">Default Notice</label>
          <textarea name="textarea" id="not">{{dnotice}}</textarea>
        </div>
      </div>
      
      <div class="form-actions">
        <button class="back-btn" id="cancel-btn"><i class="fas fa-times"></i> Cancel</button>
        <button class="add-btn" id="save-btn" ><i class="fas fa-save"></i> Save Changes</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toast-message">Settings saved successfully!</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Save button functionality
      document.getElementById('save-btn').addEventListener('click', function() {
        const settings = {
          fineRate: document.getElementById('fine-rate').value,
          gracePeriod: document.getElementById('grace-period').value,
          dnot:document.getElementById('not').value
        };
        fetch('/savedefault',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({fine:settings.fineRate,grace:settings.gracePeriod,dnotice:settings.dnot})
        })
        .then(res=>res.json())
        .then(data=>{
          if(data=='Updated'){
            console.log('Saving fine settings:', settings);
            showToast('Fine settings saved successfully!');
            document.getElementById('fine-rate').value=settings.fineRate;
            document.getElementById('grace-period').value=settings.gracePeriod;
            document.getElementById('not').value=settings.dnot;
          }
          else{
            alert("Failed");
          }
        })
        .catch(err=>{alert("error");console.log(err);})
        
        
      });
      
      // Cancel button functionality
      document.getElementById('cancel-btn').addEventListener('click', function() {
        // Reset form or go back
        window.location.href = '/libhome';
      });
    });
    
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      toastMessage.textContent = message;
      
      if (isError) {
        toast.classList.add('error');
      } else {
        toast.classList.remove('error');
      }
      
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
