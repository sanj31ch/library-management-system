<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GP Library Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{url_for('static',filename='styles2.css')}}">
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    select {
background-color: rgba(255, 255, 255, 0.1);
color: white;
}
option {
background-color: #333;
color: white;
}
</style>
</head>
<body>
  <div class="blur-bg"></div>

  <div class="sidebar">
    <div>
      <div class="sidebar-title"><i class="fas fa-book-open"></i> GP Library</div>
      <button class="sidebar-btn home-btn"><i class="fas fa-home"></i> Home</button>
      <button class="sidebar-btn view-profile-btn"><i class="fas fa-id-card"></i> View Profile</button>
      <button class="sidebar-btn view-books-btn"><i class="fas fa-book-reader"></i> View Books</button>
      <button class="sidebar-btn book-history-btn"><i class="fas fa-history" onclick="window.location.href='/bookhistory'"></i> Book History</button>
      <button class="sidebar-btn students-btn"><i class="fas fa-users"></i> Students</button>
      <button class="sidebar-btn notice-btn dropdown"><i class="fas fa-bell"></i> Notice</button>
      <div class="dropdown-content">
        <button><i class="fas fa-paper-plane"></i> Send Notice</button>
        <button><i class="fas fa-eye"></i> View Notices</button>
      </div>
      <button class="sidebar-btn attendance-btn dropdown"><i class="fas fa-calendar-check"></i> Attendance</button>
      <div class="dropdown-content">
        <button><i class="fas fa-user-check"></i> Mark Attendance</button>
        <button><i class="fas fa-eye"></i> View Attendance</button>
      </div>
    </div>
    <button class="logout-btn" onclick="window.location.href='/'"><i class="fas fa-sign-out-alt" ></i> Logout</button>
  </div>

  <div class="dashboard" id="dashboard-content">
    <div class="home-layout">
      <h1><i class="fas fa-university"></i> Welcome to GP Library</h1>
      <p>Select any option from the sidebar to proceed.</p>
      <div class="cards" style="padding-left: 89px;">
        <div class="card" id="addBookCard"><i class="fas fa-book-medical"></i><span>Add Book</span></div>
        <div class="card" id="addStudentCard"><i class="fas fa-user-plus"></i><span>Add Student</span></div>
        <div class="card" id="analyticsCard"><i class="fas fa-chart-line"></i><span>Analytics</span></div>
        
        <div class="card" id="issueBookCard"><i class="fas fa-book"></i><span>Issue Book</span></div>
        <div class="card" id="returnBookCard"><i class="fas fa-undo"></i><span>Return Book</span></div>
        <div class="card" id="fineCard"><i class="fas fa-rupee-sign"></i><span>Fine</span></div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toast-message">Book added successfully!</span>
  </div>
  

  <script>
    
    // Initialize data from localStorage or with default values
    let books = JSON.parse(localStorage.getItem('libraryBooks')) || [
      {id: '101', name: 'Java Basics', author: 'James Gosling', isbn: '9781234567890', publisher: 'Sun Press', price: '450', pages: '250', quantity: '10', available: 10},
      {id: '102', name: 'HTML & CSS', author: 'Jon Duckett', isbn: '9781118008188', publisher: 'Wiley', price: '500', pages: '400', quantity: '7', available: 7},
      {id: '103', name: 'Data Structures', author: 'Narasimha Karumanchi', isbn: '9788120340077', publisher: 'CareerMonk', price: '600', pages: '500', quantity: '5', available: 5},
      {id: '104', name: 'Python Programming', author: 'Eric Matthes', isbn: '9781593279288', publisher: 'No Starch Press', price: '550', pages: '544', quantity: '8', available: 8},
      {id: '105', name: 'Database Systems', author: 'Raghu Ramakrishnan', isbn: '9780072465631', publisher: 'McGraw-Hill', price: '650', pages: '960', quantity: '4', available: 4}
    ];

    let students = JSON.parse(localStorage.getItem('libraryStudents')) || [
      {id: '1', lib_id: 'LIB001', name: 'Rahul Sharma', year: 'Third', course: 'B.Tech (CSE)', semester: '5', mobile: '9876543210'},
      {id: '2', lib_id: 'LIB002', name: 'Priya Patel', year: 'Second', course: 'B.Sc (IT)', semester: '3', mobile: '8765432109'},
      {id: '3', lib_id: 'LIB003', name: 'Amit Singh', year: 'First', course: 'BCA', semester: '1', mobile: '7654321098'},
      {id: '4', lib_id: 'LIB004', name: 'Neha Gupta', year: 'Third', course: 'B.Tech (ECE)', semester: '6', mobile: '6543210987'},
      {id: '5', lib_id: 'LIB005', name: 'Vikram Joshi', year: 'Final', course: 'B.Tech (ME)', semester: '8', mobile: '9432109876'},
      {id: '6', lib_id: 'LIB006', name: 'Sneha Reddy', year: 'Second', course: 'B.Tech (CSE)', semester: '4', mobile: '8321098765'},
      {id: '7', lib_id: 'LIB007', name: 'Rajesh Verma', year: 'First', course: 'BBA', semester: '2', mobile: '7210987654'}
    ];

    let issuedBooks = JSON.parse(localStorage.getItem('issuedBooks')) || [
      {issueId: '1001', bookId: '101', studentId: '1', issueDate: '2025-06-01', dueDate: '2025-06-15', returnDate: '', fine: 0},
      {issueId: '1002', bookId: '102', studentId: '3', issueDate: '2025-06-05', dueDate: '2025-06-19', returnDate: '', fine: 0},
      {issueId: '1003', bookId: '103', studentId: '5', issueDate: '2025-05-20', dueDate: '2025-06-03', returnDate: '2025-06-10', fine: 70}
    ];

    let notices = JSON.parse(localStorage.getItem('libraryNotices')) || [
      {id: '1', title: 'Library Closure', content: 'The library will be closed on June 21 for maintenance.', date: '2025-06-15', sender: 'Admin', recipient: 'all'},
      {id: '2', title: 'Summer Reading Challenge', content: 'Participate in our summer reading challenge!', date: '2025-06-01', sender: 'Events Team', recipient: 'all'}
    ];

    // Save data to localStorage
    function saveBooks() {
      localStorage.setItem('libraryBooks', JSON.stringify(books));
    }

    function saveStudents() {
      localStorage.setItem('libraryStudents', JSON.stringify(students));
    }

    function saveIssuedBooks() {
      localStorage.setItem('issuedBooks', JSON.stringify(issuedBooks));
    }

    function saveNotices() {
      localStorage.setItem('libraryNotices', JSON.stringify(notices));
    }

    // Toast notification function
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      toastMessage.textContent = message;
      
      if (isError) {
        toast.classList.add('error');
      } else {
        toast.classList.remove('error');
      }
      
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Helper function to format date
    function formatDate(dateString) {
      if (!dateString) return '';
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('en-US', options);
    }

    // Calculate days between dates
    function daysBetween(date1, date2) {
      const oneDay = 24 * 60 * 60 * 1000;
      const firstDate = new Date(date1);
      const secondDate = new Date(date2);
      return Math.round(Math.abs((firstDate - secondDate) / oneDay));
    }

    // Calculate fine (₹10 per day)
    function calculateFine(dueDate, returnDate) {
      const today = new Date().toISOString().split('T')[0];
      const actualReturnDate = returnDate || today;
      
      if (actualReturnDate <= dueDate) return 0;
      
      const daysLate = daysBetween(dueDate, actualReturnDate);
      return daysLate * 10;
    }

    // Update book availability
    function updateBookAvailability() {
      books.forEach(book => {
        const issuedCount = issuedBooks.filter(
          issue => issue.bookId === book.id && !issue.returnDate
        ).length;
        book.available = book.quantity - issuedCount;
      });
      saveBooks();
    }

    // Initialize dropdown functionality
    const dropdowns = document.querySelectorAll('.sidebar-btn.dropdown'); 
    dropdowns.forEach(btn => { 
      btn.addEventListener('click', (e) => {
        // Don't toggle if clicking on a dropdown button that's already active
        if (e.target.classList.contains('active')) {
          return;
        }
        
        dropdowns.forEach(b => { 
          if (b !== btn) b.classList.remove('active'); 
        }); 
        btn.classList.toggle('active'); 
      }); 
    }); 

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.sidebar-btn.dropdown')) {
        dropdowns.forEach(btn => {
          btn.classList.remove('active');
        });
      }
    });

    // Home button
    document.querySelector(".home-btn").addEventListener("click", () => { 
      location.reload(); 
    }); 

    document.querySelector(".view-profile-btn").addEventListener("click", () => { 
      document.getElementById("dashboard-content").innerHTML = ` 
        <div class="home-layout"> 
          <h1><i class="fas fa-id-card"></i> Librarian Profile</h1> 
          <div class="profile-container">
            <div class="profile-header">
              <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
              </div>
              <div class="profile-info">
                <h2>Library Admin</h2>
                <p>Librarian</p>
              </div>
            </div>
            
            <div class="profile-details">
              <div class="detail-item">
                <span class="detail-label">ID:</span>
                <span class="detail-value">{{id}}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Name:</span>
                <span class="detail-value">{{name}}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Email:</span>
                <span class="detail-value">{{email}}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Mobile:</span>
                <span class="detail-value">{{mobile}}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Gender:</span>
                <span class="detail-value">{{gender}}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Qualification:</span>
                <span class="detail-value">{{qualify}}</span>
              </div>
            </div>
            
            <div class="profile-actions">
              <button class="edit-profile-btn" onclick="enableProfileEdit()">
                <i class="fas fa-edit"></i> Edit Profile
              </button>
            </div>
          </div>
        </div> 
      `; 
    }); 
  

    // Enable profile editing
    window.enableProfileEdit = function() {
      document.getElementById("dashboard-content").innerHTML = ` 
        <div class="home-layout"> 
          <h1><i class="fas fa-id-card"></i> Edit Profile</h1> 
          <form class="profile-form" id="editProfileForm" onsubmit="event.preventDefault(); "> 
            <div class="form-group"><label>Name:</label><input type="text" id="profileName"  value="{{name}}" /></div> 
            <div class="form-group"><label>Mobile Number (10 digits):</label><input type="text" id="profileMobile"  value="{{mobile}}" /></div> 
            <div class="form-group"><label>Email:</label><input type="email" id="profileEmail"  value="{{email}}" /></div> 
            <div class="form-group"><label>Qualification :</label></label><input type="text" id="profileAddress"  value="{{qualify}}" /></div> 
            <div class="form-actions"> 
              <button type="submit" class="update-btn" onclick="lsave()">Save Changes</button> 
              <button type="button" class="back-btn" onclick="document.querySelector('.view-profile-btn').click()">Cancel</button> 
            </div> 
          </form> 
        </div> 
      `;
    };
    function lsave(){
      let lname=document.getElementById('profileName').value;
      let lmobile=document.getElementById('profileMobile').value;
      let lemail=document.getElementById('profileEmail').value;
      let lqualify=document.getElementById('profileAddress').value;
      fetch('update',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({Role:'LIBRARIAN',name:lname,mobile:lmobile,email:lemail,qualify:lqualify})
      })
      .then(response=>response.json())
      .then(data=>{
        let stat=data;
        if (stat=='Updated') {
          showToast('Profile updated successfully!');
         // document.querySelector('.view-profile-btn').click();
         window.location.href='/library';
        }
        if (stat=='Failed') {
          alert('Failed')
        }
      })
      .catch(error=>{
        console.log(error);
        alert("other error");
      })
    }
    // Save profile changes
    

    // Add Book Card
    document.getElementById("addBookCard").addEventListener("click", () => {
      document.getElementById("dashboard-content").innerHTML = `
        <div class="home-layout">
          <h1><i class="fas fa-book-medical"></i> Add New Book</h1>
          
          <form class="add-form" id="addBookForm">
            <h2>Book Details</h2>
            
            <div class="form-row">
              <div class="form-group">
                <label>Book ID</label>
                <input type="text" id="bookId" required placeholder="Enter book ID" />
              </div>
              <div class="form-group">
                <label>Book Name</label>
                <input type="text" id="bookName" required placeholder="Enter book name" />
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label>Author</label>
                <input type="text" id="bookAuthor" required placeholder="Enter author name" />
              </div>
              <div class="form-group">
                <label>ISBN</label>
                <input type="text" id="bookIsbn" required placeholder="Enter ISBN number" />
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label>Publisher</label>
                <input type="text" id="bookPublisher" required placeholder="Enter publisher name" />
              </div>
              <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="bookPrice" required placeholder="Enter price" min="0" />
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label>Pages</label>
                <input type="number" id="bookPages" required placeholder="Enter total pages" min="1" />
              </div>
              <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="bookQuantity" required placeholder="Enter quantity" min="1" />
              </div>
            </div>
            
            <button type="submit" class="add-btn">
              <i class="fas fa-plus-circle"></i> Add Book
            </button>
            
            <div class="form-actions" style="margin-top: 20px;">
              <button type="button" class="back-btn" onclick="location.reload()">Back to Home</button>
            </div>
          </form>
        </div>
      `;

      document.getElementById("addBookForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const bookId = document.getElementById("bookId").value;
        const bookName = document.getElementById("bookName").value;
        const bookAuthor = document.getElementById("bookAuthor").value;
        const bookIsbn = document.getElementById("bookIsbn").value;
        const bookPublisher = document.getElementById("bookPublisher").value;
        const bookPrice = document.getElementById("bookPrice").value;
        const bookPages = document.getElementById("bookPages").value;
        const bookQuantity = document.getElementById("bookQuantity").value;
        
        // Check if book ID already exists
        if (books.some(book => book.id === bookId)) {
          showToast('Book ID already exists!', true);
          return;
        }
        
        books.push({
          id: bookId,
          name: bookName,
          author: bookAuthor,
          isbn: bookIsbn,
          publisher: bookPublisher,
          price: bookPrice,
          pages: bookPages,
          quantity: bookQuantity,
          available: bookQuantity
        });
        
        saveBooks();
        showToast(`${bookName} added successfully!`);
        this.reset();
      });
    });

    // Add Student Card
    document.getElementById("addStudentCard").addEventListener("click", () => {
      document.getElementById("dashboard-content").innerHTML = `
        <div class="home-layout">
          <h1><i class="fas fa-user-plus"></i> Add New Student</h1>
          
          <form class="add-form" id="addStudentForm">
            <div class="form-header">
              <div class="form-header-icon">
                <i class="fas fa-user-graduate"></i>
              </div>
              <h2>Student Registration</h2>
              <p>Fill in the details to register a new student</p>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label>Student ID</label>
                <input type="text" id="studentId" required placeholder="Enter student ID" />
              </div>
              <div class="form-group">
                <label>Library ID</label>
                <input type="text" id="studentLibId" required placeholder="Enter library ID (e.g. LIB001)" />
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="studentName" required placeholder="Enter student name" />
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label>Year</label>
                <select id="studentYear" required>
                  <option value="">Select Year</option>
                  <option value="First">First Year</option>
                  <option value="Second">Second Year</option>
                  <option value="Third">Third Year</option>
                  <option value="Final">Final Year</option>
                </select>
              </div>
              <div class="form-group">
                <label>Course</label>
                <select id="studentCourse" required>
                  <option value="">Select Course</option>
                  <option value="B.Tech (CSE)">B.Tech (CSE)</option>
                  <option value="B.Tech (ECE)">B.Tech (ECE)</option>
                  <option value="B.Tech (ME)">B.Tech (ME)</option>
                  <option value="B.Sc (IT)">B.Sc (IT)</option>
                  <option value="BCA">BCA</option>
                  <option value="BBA">BBA</option>
                </select>
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label>Semester</label>
                <select id="studentSemester" required>
                  <option value="">Select Semester</option>
                  <option value="1">Semester 1</option>
                  <option value="2">Semester 2</option>
                  <option value="3">Semester 3</option>
                  <option value="4">Semester 4</option>
                  <option value="5">Semester 5</option>
                  <option value="6">Semester 6</option>
                  <option value="7">Semester 7</option>
                  <option value="8">Semester 8</option>
                </select>
              </div>
              <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="studentMobile" required placeholder="Enter mobile number" pattern="\\d{10}" />
              </div>
            </div>
            
            <div class="form-footer">
              <button type="submit" class="add-btn">
                <i class="fas fa-user-plus"></i> Register Student
              </button>
              <button type="button" class="back-btn" onclick="location.reload()">
                <i class="fas fa-arrow-left"></i> Cancel
              </button>
            </div>
          </form>
        </div>
      `;
      
      document.getElementById("addStudentForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const studentId = document.getElementById("studentId").value;
        const studentLibId = document.getElementById("studentLibId").value;
        const studentName = document.getElementById("studentName").value;
        const studentYear = document.getElementById("studentYear").value;
        const studentCourse = document.getElementById("studentCourse").value;
        const studentSemester = document.getElementById("studentSemester").value;
        const studentMobile = document.getElementById("studentMobile").value;
        
        // Check if student ID already exists
        if (students.some(student => student.id === studentId)) {
          showToast('Student ID already exists!', true);
          return;
        }
        
        // Check if library ID already exists
        if (students.some(student => student.lib_id === studentLibId)) {
          showToast('Library ID already exists!', true);
          return;
        }
        
        students.push({
          id: studentId,
          lib_id: studentLibId,
          name: studentName,
          year: studentYear,
          course: studentCourse,
          semester: studentSemester,
          mobile: studentMobile
        });
        
        saveStudents();
        showToast(`${studentName} registered successfully!`);
        this.reset();
      });
    });

    // Analytics Card
    document.getElementById("analyticsCard").addEventListener("click", () => {
      updateBookAvailability();
      
      // Calculate statistics
      const totalBooks = books.reduce((sum, book) => sum + parseInt(book.quantity), 0);
      const availableBooks = books.reduce((sum, book) => sum + parseInt(book.available), 0);
      const issuedBooksCount = totalBooks - availableBooks;
      const totalStudents = students.length;
      
      // Calculate overdue books
      const today = new Date().toISOString().split('T')[0];
      const overdueBooks = issuedBooks.filter(issue => 
        !issue.returnDate && issue.dueDate < today
      ).length;
      
      document.getElementById("dashboard-content").innerHTML = `
        <div class="home-layout">
          <h1><i class="fas fa-chart-line"></i> Library Analytics</h1>
          
          <div class="stats-container">
            <div class="stat-card">
              <h3>Total Books</h3>
              <div class="value">${totalBooks}</div>
              <div class="change">${books.length} titles</div>
            </div>
            
            <div class="stat-card">
              <h3>Available Books</h3>
              <div class="value">${availableBooks}</div>
              <div class="change">${Math.round((availableBooks/totalBooks)*100)}% available</div>
            </div>
            
            <div class="stat-card">
              <h3>Issued Books</h3>
              <div class="value">${issuedBooksCount}</div>
              <div class="change ${overdueBooks > 0 ? 'negative' : ''}">
                ${overdueBooks} overdue
              </div>
            </div>
            
            <div class="stat-card">
              <h3>Registered Students</h3>
              <div class="value">${totalStudents}</div>
              <div class="change">${issuedBooksCount} active issues</div>
            </div>
          </div>
          
          <div class="chart-container" style="height: 300px; width: 400px;">
            <h2>Book Availability</h2>
            <canvas id="availabilityChart"></canvas>
          </div>
          
          <div class="chart-container" style="height: 300px; width: 400px;">
            <h2>Monthly Issues</h2>
            <canvas id="monthlyIssuesChart"></canvas>
          </div>
          
          <div class="form-actions" style="margin-top: 20px;">
            <button class="back-btn" onclick="location.reload()">Back to Home</button>
          </div>
        </div>
      `;

      // Create availability pie chart
      const availabilityCtx = document.getElementById('availabilityChart').getContext('2d');
      new Chart(availabilityCtx, {
        type: 'pie',
        data: {
          labels: ['Available', 'Issued'],
          datasets: [{
            data: [availableBooks, issuedBooksCount],
            backgroundColor: ['#4CAF50', '#2196F3'],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      });

      // Create monthly issues bar chart (sample data)
      const monthlyCtx = document.getElementById('monthlyIssuesChart').getContext('2d');
      new Chart(monthlyCtx, {
        type: 'bar',
        data: {
          labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
          datasets: [{
            label: 'Books Issued',
            data: [12, 19, 15, 20, 18, 25],
            backgroundColor: '#4CAF50',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    });

    // Book History
    document.querySelector(".book-history-btn").addEventListener("click", () => {
      updateBookAvailability();
      
      document.getElementById("dashboard-content").innerHTML = `
        <div class="home-layout">
          <h1><i class="fas fa-history"></i> Book History</h1>
          
          <div class="filter-container">
            <div class="filter-group">
              <label>Filter by Status:</label>
              <select id="historyStatusFilter">
                <option value="all">All</option>
                <option value="issued">Issued</option>
                <option value="returned">Returned</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Filter by Date Range:</label>
              <input type="date" id="historyStartDate" />

        const student = students.find(s => s.id === issue.studentId);
        const daysOverdue = daysBetween(issue.dueDate, new Date().toISOString().split('T')[0]);
        const fine = daysOverdue * 10;
        
        // Create notice
        const noticeId = 'N' + Date.now().toString().slice(-6);
        const noticeTitle = `Overdue Book: ${book.name}`;
        const noticeContent = `Dear ${student.name},\n\nThis is a reminder that your book "${book.name}" is overdue by ${daysOverdue} days. Please return it immediately to avoid additional fines. Current fine: ₹${fine}.\n\nThank you,\nLibrary Admin`;
        
        notices.push({
          id: noticeId,
          title: noticeTitle,
          content: noticeContent,
          date: new Date().toISOString().split('T')[0],
          sender: 'Library Admin',
          recipient: student.id

        saveNotices();
        showToast(`Overdue notice sent to ${student.name}`);
